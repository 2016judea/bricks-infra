[project]
name = "bricks-infra"
version = "0.1.0"
description = "Local + cloud model serving for Brick & Mortar AI: embeddings, reranking, and cheap LLM generation."
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "httpx>=0.27.0",
    # Local embeddings + reranker. Same lib bricks already uses, so the
    # M5's Metal GPU is used automatically (device="mps").
    "sentence-transformers>=3.3.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0", "ruff>=0.7.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bricks_infra"]

[tool.ruff]
line-length = 100
